version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: joineazy-db
    environment:
      POSTGRES_USER: joineazy_user
      POSTGRES_PASSWORD: root
      POSTGRES_DB: joineazy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joineazy_user -d joineazy_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - joineazy-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joineazy-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: joineazy_user
      DB_PASSWORD: root
      DB_NAME: joineazy_db
      JWT_SECRET: joineazy_super_secret_key_2026
      JWT_EXPIRY: 7d
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - joineazy-network
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: joineazy-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_BACKEND_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - joineazy-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  joineazy-network:
    driver: bridge